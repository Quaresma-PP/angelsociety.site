<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nossa Senhora Desatadora de Nós – Ouça a oração das 7 palavras que desatam qualquer nó da sua vida." />
  <title>Desatadora de Nós – Oração das 7 Palavras</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,700;0,800;1,700;1,800&family=Raleway:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      background: linear-gradient(170deg, #1c0800 0%, #2e1400 50%, #1c0800 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 48px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.75);
      background: #fff8f0;
    }

    /* Imagem full-width */
    .img-wrap {
      position: relative;
      width: 100%;
      background: #2e1400;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .img-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: linear-gradient(transparent, #fff8f0);
    }

    .hero-fallback {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #3d1c08, #6b3010);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    /* Divisor com cruz */
    .divider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 28px 0;
    }

    .divider-line       { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #b06820); }
    .divider-line.right { background: linear-gradient(90deg, #b06820, transparent); }
    .divider-icon       { color: #b06820; font-size: 15px; }

    /* Conteúdo */
    .content {
      padding: 18px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .headline {
      font-family: 'EB Garamond', serif;
      font-size: clamp(26px, 7.5vw, 34px);
      font-weight: 800;
      color: #1c0800;
      text-align: center;
      line-height: 1.25;
    }

    .headline em {
      font-style: italic;
      color: #8b3e10;
    }

    .subtext {
      font-size: 12px;
      font-weight: 800;
      color: #9a6640;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
    }

    /* Botão CTA */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 20px;
      background: linear-gradient(135deg, #b85015, #cc6820, #e08030);
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(160,70,10,0.55);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: glowBrown 2.4s ease-in-out infinite;
    }

    .cta-btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(160,70,10,0.75); }
    .cta-btn:active { transform: translateY(0); }

    @keyframes glowBrown {
      0%, 100% { box-shadow: 0 6px 24px rgba(160,70,10,0.50); }
      50%       { box-shadow: 0 6px 38px rgba(160,70,10,0.88); }
    }

    .trust {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a08060;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: rgba(255,255,255,0.42);
      font-size: 11px;
      line-height: 2;
    }

    footer a {
      color: rgba(255,255,255,0.62);
      text-decoration: underline;
    }
  </style>

  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>
  <script>
    window.googlePixelId = "6a052935a823e9c41c568ab7";
    var a = document.createElement("script");
    a.setAttribute("async", "");
    a.setAttribute("defer", "");
    a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
    document.head.appendChild(a);
  </script>
</head>
<body>

  <div class="card">

    <div class="img-wrap">
      <img
        class="hero-img"
        src="des1.png"
        alt="Nossa Senhora Desatadora de Nós"
        onerror="this.outerHTML='<div class=\'hero-fallback\'>🙏</div>'"
      />
      <div class="img-overlay"></div>
    </div>

    <div class="divider-wrap">
      <div class="divider-line"></div>
      <span class="divider-icon">✝</span>
      <div class="divider-line right"></div>
    </div>

    <div class="content">

      <h1 class="headline">
        Ela desata os nós que<br /><em>você já não consegue<br />desatar sozinho</em>
      </h1>

      <p class="subtext">Ouça a oração das 7 palavras</p>

      <a href="https://angelsociety.site/vsl-1" class="cta-btn" id="cta-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
          <path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/>
        </svg>
        Ouvir a Oração Agora
      </a>

      <div class="trust">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#a08060" viewBox="0 0 16 16">
          <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        </svg>
        100% gratuito · acesso imediato
      </div>

    </div>
  </div>

  <footer>
    &copy; 2026 Desatadora de Nós. Todos os direitos reservados.<br />
    <a href="termos.html">Termos de Uso</a> &nbsp;·&nbsp; <a href="privacidade.html">Política de Privacidade</a>
  </footer>

  <script>
    (function () {
      var params = window.location.search;
      if (!params) return;
      var btn = document.getElementById('cta-btn');
      var base = btn.href;
      btn.href = base + (base.indexOf('?') !== -1 ? '&' : '?') + params.slice(1);
    })();
  </script>
</body>
</html>
